<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev SEO Check</title>
<meta name="description" content="Nhập URL để phân tích SEO: điểm on-page tức thì, audit toàn site, meta, tiêu đề, hình ảnh, liên kết, mạng xã hội và schema.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%230b6b5d' stroke-width='4'/%3E%3Cpath d='M21 21l7 7' stroke='%230b6b5d' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f5f1; --surface:#ffffff; --sunk:#eceee8; --ink:#15181a; --muted:#5b625f; --line:#dde0d9;
  --accent:#0b6b5d; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --good:#1d8a4b; --warn:#b7791f; --bad:#c2412d; --good-bg:#e3f4e8; --warn-bg:#fbf0dc; --bad-bg:#fbe5e0;
  --serp-title:#1a0dab; --serp-url:#1f6f43;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101312; --surface:#171b1a; --sunk:#1e2322; --ink:#e8ece9; --muted:#9aa39f; --line:#2a302e;
  --accent:#3fbfa6; --accent-ink:#06201b; --accent-soft:#16352f;
  --good:#4cc47f; --warn:#e3a94a; --bad:#f07a63; --good-bg:#143222; --warn-bg:#35290f; --bad-bg:#3a1a14;
  --serp-title:#8ab4f8; --serp-url:#7fc79a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101312; --surface:#171b1a; --sunk:#1e2322; --ink:#e8ece9; --muted:#9aa39f; --line:#2a302e;
  --accent:#3fbfa6; --accent-ink:#06201b; --accent-soft:#16352f;
  --good:#4cc47f; --warn:#e3a94a; --bad:#f07a63; --good-bg:#143222; --warn-bg:#35290f; --bad-bg:#3a1a14;
  --serp-title:#8ab4f8; --serp-url:#7fc79a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:1.05rem}
.brand svg{width:26px;height:26px}
.brand small{font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* search */
.hero{padding-block:28px 22px}
.hero h1{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.02em;max-width:22ch}
.hero p{margin:.5em 0 0;color:var(--muted);max-width:62ch}
form.search{margin-top:20px;display:grid;grid-template-columns:1fr auto;gap:10px}
.field{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding-inline:14px;min-width:0}
.field:focus-within{border-color:var(--accent)}
.field span{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:.85rem}
.field input{border:0;outline:0;background:none;padding:14px 8px;width:100%;min-width:0;font-size:1.02rem}
.go{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 26px;cursor:pointer;font-size:1rem}
.go:disabled{opacity:.6;cursor:progress}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.opts select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.recent button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.alert{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:500}

/* results layout */
#results{padding-bottom:60px}
.head{display:grid;grid-template-columns:auto auto 1fr;gap:16px;align-items:stretch;margin-bottom:16px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;min-width:0}
.ring{--p:0;--c:var(--accent);width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--surface) 78%,transparent 79% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0)}
.ring b{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring b small{font-size:.8rem;font-weight:600}
.scorecard h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.scorecard .big{font-size:1rem;font-weight:700;margin-top:2px}
.scorecard .sub{font-size:.82rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px;width:160px;max-width:100%}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.pageid{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.pageid .u{word-break:break-all;font-weight:600}
.pageid .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:.92rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .n{font-size:.72rem;background:var(--sunk);border-radius:999px;padding:0 6px;margin-left:5px;color:var(--muted)}
.panel{padding-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.box>h2{font-size:1rem;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}

/* checklist */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;margin-top:1px}
.dot.pass{background:var(--good-bg);color:var(--good)} .dot.warn{background:var(--warn-bg);color:var(--warn)} .dot.fail{background:var(--bad-bg);color:var(--bad)}
.checks .w{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* key-value */
.kv{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);border-top:1px solid var(--line)}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){color:var(--muted);font-size:.86rem;padding-right:12px;font-weight:500}
.kv .val{word-break:break-word}
.len{font-size:.75rem;margin-left:6px}
.empty{color:var(--bad);font-style:italic}

/* serp + social previews */
.serp{font-family:Arial,system-ui,sans-serif;max-width:600px}
.serp .site{display:flex;gap:10px;align-items:center;font-size:.82rem}
.serp .site img{width:26px;height:26px;border-radius:50%;background:var(--sunk);padding:4px}
.serp .t{color:var(--serp-title);font-size:1.25rem;line-height:1.3;margin:4px 0 3px}
.serp .d{color:var(--muted);font-size:.9rem}
.serp .url{color:var(--ink);font-size:.8rem}
.card-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:520px;background:var(--sunk)}
.card-prev .img{aspect-ratio:1.91/1;background:var(--line) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:.85rem;max-width:100%}
.card-prev .body{padding:10px 12px}
.card-prev .dom{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.card-prev .ct{font-weight:700;margin:2px 0}
.card-prev .cd{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--sunk);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td .thumb{width:54px;height:40px;object-fit:contain;background:var(--sunk);border-radius:4px}
td a{word-break:break-all}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;flex:1 1 200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.84rem;font-weight:600}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font-size:.78rem;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}

/* headings outline */
.outline{list-style:none;margin:0;padding:0}
.outline li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.outline .lv{font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:600;border-radius:5px;padding:0 5px;background:var(--sunk);color:var(--muted);flex:none}
.outline .lv.h1{background:var(--accent);color:var(--accent-ink)}

/* schema */
details.sd{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
details.sd summary{padding:10px 14px;cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600}
details.sd pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);overflow:auto;max-height:420px;font-size:.8rem;background:var(--sunk)}

/* tools */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.toolgrid a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}
.toolgrid a:hover{border-color:var(--accent)}
.toolgrid a span{color:var(--muted)}

/* audit */
.stages{list-style:none;padding:0;margin:0 0 12px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stages li{font-size:.7rem;color:var(--muted);text-align:center}
.stages li i{display:block;height:5px;border-radius:4px;background:var(--sunk);margin-bottom:4px}
.stages li.done i{background:var(--accent)} .stages li.now i{background:var(--warn)}
.log{background:var(--sunk);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font-size:.76rem;white-space:pre-wrap;word-break:break-word;margin:0}
.cats{display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.88rem}
.cat .track{grid-column:1/-1;height:7px;border-radius:6px;background:var(--sunk);overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:6px}
.cat b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.act{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.act summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.act summary::-webkit-details-marker{display:none}
.act .pri{font-weight:800;font-size:.76rem;border-radius:6px;padding:2px 7px}
.pri.P1{background:var(--bad-bg);color:var(--bad)} .pri.P2{background:var(--warn-bg);color:var(--warn)} .pri.P3{background:var(--sunk);color:var(--muted)}
.act .meta{display:flex;gap:6px;flex-wrap:wrap}
.act .inner{padding:0 14px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.act .inner ul{margin:0;padding-left:18px}
.act .inner li{word-break:break-all}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.84rem;background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:10px}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.bar i{transition:none}}
footer{padding-block:24px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}

@media (max-width:860px){
  .head{grid-template-columns:1fr 1fr}
  .pageid{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  form.search{grid-template-columns:1fr}
  .go{padding:12px}
  .head{grid-template-columns:1fr}
  .ring{width:76px;height:76px}
  .kv{grid-template-columns:1fr}
  .kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}
  .stages li span{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="var(--accent)" stroke-width="3.5"/><path d="M21 21l7 7" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/><path d="M10 15.5l3 3 5-7" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Jev SEO Check <small>v<span id="ver">0.1</span></small></span>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="vi" aria-pressed="true">VI</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <h1 data-t="heroTitle"></h1>
    <p data-t="heroSub"></p>
    <form class="search" id="form" autocomplete="off">
      <label class="field"><span>URL</span><input id="url" name="url" type="text" inputmode="url" spellcheck="false" required placeholder="https://vidu.vn"></label>
      <button class="go" id="go" type="submit" data-t="analyze"></button>
    </form>
    <div class="opts">
      <label><input type="checkbox" id="opt-audit" checked> <span data-t="optAudit"></span></label>
      <label><span data-t="optPages"></span>
        <select id="opt-pages"><option value="10">10</option><option value="30" selected>30</option><option value="60">60</option></select></label>
      <label><input type="checkbox" id="opt-psi" checked> <span data-t="optPsi"></span></label>
    </div>
    <div class="recent" id="recent"></div>
    <div class="alert" id="error" hidden></div>
  </section>

  <section id="results" hidden>
    <div class="head">
      <div class="scorecard">
        <div class="ring" id="ring-page"><b>–</b></div>
        <div><h3 data-t="pageScore"></h3><div class="big" id="page-grade"></div><div class="sub" data-t="pageScoreSub"></div></div>
      </div>
      <div class="scorecard">
        <div class="ring" id="ring-site"><b>–</b></div>
        <div><h3 data-t="siteScore"></h3><div class="big" id="site-grade"></div><div class="sub" id="site-sub"></div><div class="bar" id="site-bar" hidden><i></i></div></div>
      </div>
      <div class="pageid"><div class="muted" style="font-size:.78rem" data-t="analyzed"></div><div class="u" id="final-url"></div><div class="chips" id="id-chips"></div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </section>

  <footer>
    <span data-t="footer"></span>
  </footer>
</div>

<script>
"use strict";
const I18N = {
  vi: {
    heroTitle: "Kiểm tra SEO website trong một lần nhấp",
    heroSub: "Nhập URL: công cụ đọc ngay meta, tiêu đề, hình ảnh, liên kết, mạng xã hội và schema của trang, chấm điểm on-page theo %, rồi audit toàn site với 52 quy tắc theo Google Search Central.",
    analyze: "Phân tích", analyzing: "Đang phân tích…",
    optAudit: "Audit toàn site", optPages: "Số trang tối đa", optPsi: "Đo Core Web Vitals (PageSpeed)",
    pageScore: "Điểm trang này", pageScoreSub: "On-page, 20 tiêu chí", siteScore: "Điểm toàn site", analyzed: "Trang đã phân tích",
    footer: "Jev SEO Check. Điểm số giúp xếp thứ tự việc cần làm, không dự đoán thứ hạng hay lưu lượng truy cập.",
    tabOverview: "Tổng quan", tabSummary: "Tóm tắt", tabHeadings: "Tiêu đề", tabImages: "Hình ảnh", tabLinks: "Liên kết", tabSocial: "Mạng xã hội", tabSchema: "Schema", tabTools: "Công cụ", tabAudit: "Audit toàn site",
    checklist: "Tiêu chí on-page", serp: "Xem trước trên Google", passed: "đạt", warned: "cảnh báo", failed: "lỗi",
    title: "Title", description: "Description", keywords: "Keywords", url: "URL", canonical: "Canonical", robots: "Robots meta", xrobots: "X-Robots-Tag",
    author: "Author", publisher: "Publisher", lang: "Ngôn ngữ", charset: "Charset", viewport: "Viewport", favicon: "Favicon", hreflang: "Hreflang",
    words: "Số từ", status: "Mã HTTP", ttfb: "Thời gian phản hồi", size: "Dung lượng HTML", redirects: "Chuyển hướng", generator: "Generator", server: "Server", themeColor: "Theme color",
    robotsTxt: "robots.txt", sitemap: "Sitemap", missing: "Thiếu", chars: "ký tự", selfCanon: "tự tham chiếu", otherCanon: "trỏ tới URL khác", none: "Không có",
    found: "có", notFound: "không có", urlsInSitemap: "URL trong sitemap", aiBots: "Bot AI được phép",
    headingCounts: "Số lượng", outline: "Cấu trúc tiêu đề", filterAll: "Tất cả",
    imgTotal: "Tổng ảnh", imgNoAlt: "Thiếu alt", imgEmptyAlt: "Alt rỗng", imgNoTitle: "Thiếu title", imgNoDim: "Thiếu kích thước",

const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang = store.get("jevseo.lang") === "en" ? "en" : "vi";
const t = k => I18N[lang][k] ?? k;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeHref = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const num = n => (n ?? 0).toLocaleString(lang === "vi" ? "vi-VN" : "en-US");
const scoreColor = p => p >= 90 ? "var(--good)" : p >= 60 ? "var(--warn)" : "var(--bad)";
const gradeOf = p => p >= 90 ? "A" : p >= 75 ? "B" : p >= 60 ? "C" : p >= 40 ? "D" : "F";

const state = {meta: null, audit: null, auditId: null, auditError: null, auditOn: true, tab: "overview", poll: null, linkFilter: "all", linkQuery: "", imgMissing: false, hLevel: 0};

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (!$("#go").disabled) $("#go").textContent = t("analyze");
  if (state.meta) render();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {lang = b.dataset.lang; store.set("jevseo.lang", lang); applyLang();}));

function showError(msg){const e = $("#error"); e.textContent = msg; e.hidden = !msg;}
function setRing(el, p){
  el.style.setProperty("--p", p ?? 0);
  el.style.setProperty("--c", p == null ? "var(--line)" : scoreColor(p));
  el.innerHTML = p == null ? "<b>–</b>" : `<b>${p}<small>%</small></b>`;
}

function recent(){
  const list = store.get("jevseo.recent") || [];
  $("#recent").innerHTML = list.map(u => `<button type="button" data-u="${esc(u)}">${esc(u.replace(/^https?:\/\//, ""))}</button>`).join("");
  $("#recent").querySelectorAll("button").forEach(b => b.onclick = () => {$("#url").value = b.dataset.u; run();});
}
function remember(u){const l = (store.get("jevseo.recent") || []).filter(x => x !== u); l.unshift(u); store.set("jevseo.recent", l.slice(0, 8)); recent();}

async function api(path, body){
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(lang === "vi" ? (data.message_vi || t("errNetwork")) : (data.message || t("errNetwork")));
  return data;
}

async function run(){
  let url = $("#url").value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  showError("");
  clearTimeout(state.poll);
  Object.assign(state, {meta: null, audit: null, auditId: null, auditError: null, auditOn: $("#opt-audit").checked, tab: "overview", linkFilter: "all", linkQuery: "", imgMissing: false, hLevel: 0});
  const go = $("#go"); go.disabled = true; go.innerHTML = `<span class="spinner"></span> ${esc(t("analyzing"))}`;
  history.replaceState(null, "", "?url=" + encodeURIComponent(url));
  const auditReq = state.auditOn ? api("/api/audits", {url, pages: +$("#opt-pages").value, pagespeed: $("#opt-psi").checked}).then(j => {state.auditId = j.id; state.audit = j; pollAudit();}).catch(e => {state.auditError = e.message; if (state.meta) render();}) : null;
  try {
    state.meta = await api("/api/inspect", {url});
    remember(url);
    $("#results").hidden = false;
    render();
  } catch (e) {
    showError(t("errInspect") + ": " + e.message);
  } finally {
    go.disabled = false; go.textContent = t("analyze");
  }
  await auditReq;
}
$("#form").addEventListener("submit", e => {e.preventDefault(); run();});

async function pollAudit(){
  if (!state.auditId) return;
  try {
    state.audit = await api("/api/audits/" + state.auditId);
  } catch (e) { state.auditError = e.message; }
  if (state.meta) render(true);
  if (state.audit && ["queued", "running"].includes(state.audit.status)) state.poll = setTimeout(pollAudit, 2000);
}

/* ---------- rendering ---------- */
const TABS = [["overview","tabOverview"],["summary","tabSummary"],["headings","tabHeadings"],["images","tabImages"],["links","tabLinks"],["social","tabSocial"],["schema","tabSchema"],["tools","tabTools"],["audit","tabAudit"]];

function render(fromPoll){
  const m = state.meta;
  setRing($("#ring-page"), m.score);
  $("#page-grade").textContent = t("grade")(gradeOf(m.score));
  renderSiteCard();
  $("#final-url").textContent = m.summary.url;
  const c = m.checks.reduce((a, x) => (a[x.state]++, a), {pass: 0, warn: 0, fail: 0});
  $("#id-chips").innerHTML = `<span class="chip ${m.summary.status === 200 ? "good" : "bad"}">HTTP ${esc(m.summary.status)}</span>
    <span class="chip good">${c.pass} ${esc(t("passed"))}</span><span class="chip warn">${c.warn} ${esc(t("warned"))}</span><span class="chip bad">${c.fail} ${esc(t("failed"))}</span>
    ${m.summary.lang ? `<span class="chip">${esc(m.summary.lang)}</span>` : ""}${m.summary.ttfb_ms != null ? `<span class="chip">${num(m.summary.ttfb_ms)} ms</span>` : ""}`;
  const counts = {headings: m.headings.items.length, images: m.images.total, links: m.links.total, schema: m.schema.jsonld.length + m.schema.microdata.length};
  $("#tabs").innerHTML = TABS.map(([id, k]) => `<button role="tab" type="button" data-tab="${id}" aria-selected="${state.tab === id}">${esc(t(k))}${counts[id] != null ? `<span class="n">${counts[id]}</span>` : ""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {state.tab = b.dataset.tab; render();});
  if (fromPoll && !["overview", "audit"].includes(state.tab)) return;  // keep filters and scroll on other tabs
  const panel = {overview, summary, headings, images, links, social, schema, tools, audit}[state.tab];
  const active = document.activeElement && document.activeElement.id;
  $("#panel").innerHTML = panel();
  bind();
  if (active && document.getElementById(active)) { const el = document.getElementById(active); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
}

function renderSiteCard(){
  const a = state.audit, ring = $("#ring-site"), sub = $("#site-sub"), bar = $("#site-bar");
  bar.hidden = true;
  if (!state.auditOn) { setRing(ring, null); $("#site-grade").textContent = ""; sub.textContent = t("auditOff"); return; }
  if (state.auditError || (a && a.status === "error")) { setRing(ring, null); $("#site-grade").textContent = t("auditError"); sub.textContent = state.auditError || (lang === "vi" ? a.error_vi || a.error : a.error); return; }
  if (!a || a.status === "queued" || a.status === "running") {
    setRing(ring, null);
    $("#site-grade").innerHTML = `<span class="spinner"></span>`;
    sub.textContent = !a ? t("queued") : a.status === "queued" ? (a.queue_position ? t("queuedAhead")(a.queue_position) : t("queued")) : `${t("running")} ${a.stage || 1}/7 · ${t("stages")[(a.stage || 1) - 1]}`;
    bar.hidden = false; bar.querySelector("i").style.width = (a && a.status === "running" ? Math.max(4, ((a.stage || 1) - 0.5) / 7 * 100) : 2) + "%";
    return;
  }
  const r = a.result;
  if (!r) return;
  setRing(ring, r.overall);
  $("#site-grade").textContent = t("grade")(r.grade) + (r.partial.length ? " · " + t("partial") : "");
  sub.textContent = t("pagesCrawled")(r.pages_crawled);
}

function lenChip(n, lo, hi){ if (!n) return `<span class="chip bad len">0 ${esc(t("chars"))}</span>`; return `<span class="chip ${n >= lo && n <= hi ? "good" : "warn"} len">${n} ${esc(t("chars"))}</span>`; }
const val = (v, mono) => v ? `<span class="val${mono ? " mono" : ""}">${esc(v)}</span>` : `<span class="empty">${esc(t("missing"))}</span>`;
const link = u => u ? `<a href="${safeHref(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>` : `<span class="empty">${esc(t("missing"))}</span>`;

function serpPreview(){
  const s = state.meta.summary;
  let u; try { u = new URL(s.url); } catch (e) { u = {hostname: s.url, pathname: ""}; }
  const title = s.title || u.hostname, desc = s.description || "";
  const cut = (x, n) => x.length > n ? x.slice(0, n - 1).trimEnd() + "…" : x;
  return `<div class="serp"><div class="site">${s.favicon ? `<img src="${safeHref(s.favicon)}" alt="" loading="lazy">` : ""}<div><div class="url">${esc(u.hostname)}</div><div class="muted" style="font-size:.76rem">${esc(s.url)}</div></div></div>
    <div class="t">${esc(cut(title, 62))}</div><div class="d">${esc(cut(desc, 158)) || `<span class="empty">${esc(t("missing"))}: meta description</span>`}</div></div>`;
}

function overview(){
  const m = state.meta;
  const order = {fail: 0, warn: 1, pass: 2};
  const items = [...m.checks].sort((a, b) => order[a.state] - order[b.state] || b.weight - a.weight);
  return `<div class="grid2">
    <div class="box"><h2>${esc(t("checklist"))} <span class="chip acc">${m.score}%</span></h2><ul class="checks">
      ${items.map(c => `<li><span class="dot ${c.state}">${c.state === "pass" ? "✓" : c.state === "warn" ? "!" : "×"}</span><span>${esc(c[lang])}</span><span class="w">${c.state === "pass" ? c.weight : c.state === "warn" ? c.weight / 2 : 0}/${c.weight}</span></li>`).join("")}
    </ul></div>
    <div class="stack">
      <div class="box"><h2>${esc(t("serp"))}</h2>${serpPreview()}</div>
      ${state.auditOn ? `<div class="box"><h2>${esc(t("siteScore"))} <button class="btn" type="button" data-goto="audit">${esc(t("tabAudit"))} →</button></h2>${auditMini()}</div>` : ""}
      <div class="box"><h2>${esc(t("robotsTxt"))} · ${esc(t("sitemap"))}</h2>${robotsBlock()}</div>
    </div></div>`;
}

function auditMini(){
  const a = state.audit;
  if (state.auditError || (a && a.status === "error")) return `<div class="note">${esc(t("auditError"))}: ${esc(state.auditError || (lang === "vi" ? a.error_vi || a.error : a.error))}</div>`;
  if (!a || !a.result) return stagesBar(a) ;
  return catBars(a.result.categories.slice(0, 9));
}

function stagesBar(a){
  const st = a && a.status === "running" ? (a.stage || 1) : 0;
  return `<ol class="stages">${t("stages").map((n, i) => `<li class="${i + 1 < st || (a && a.status === "done") ? "done" : i + 1 === st ? "now" : ""}"><i></i><span>${esc(n)}</span></li>`).join("")}</ol>
    <div class="muted" style="font-size:.84rem"><span class="spinner"></span> ${esc(!a || a.status === "queued" ? t("queued") : t("running"))}</div>`;
}

function catBars(cats){
  return `<div class="cats">${cats.map(c => `<div class="cat"><span>${esc(lang === "vi" ? c.name_vi : c.name)}</span><b>${c.score == null ? `<span class="muted" style="font-weight:500;font-size:.78rem">${esc(t("notAssessed"))}</span>` : c.score + "%"}</b>
    <div class="track"><i style="width:${c.score ?? 0}%;background:${c.score == null ? "var(--line)" : scoreColor(c.score)}"></i></div></div>`).join("")}</div>`;
}

function robotsBlock(){
  const r = state.meta.robots_txt || {}, sm = state.meta.sitemap || {};
  const ai = Object.entries(r.ai_bots || {});
  return `<div class="kv">
    <div>${esc(t("robotsTxt"))}</div><div>${r.present ? `<span class="chip good">${esc(t("found"))}</span>` : `<span class="chip bad">${esc(t("notFound"))}</span>`} ${link(r.url)}${r.disallow_all ? ` <span class="chip bad">Disallow: /</span>` : ""}</div>
    <div>${esc(t("sitemap"))}</div><div>${(sm.files || []).length ? sm.files.map(f => `<div>${f.error ? `<span class="chip bad">${esc(f.error)}</span>` : `<span class="chip good">${num(f.urls || f.children || 0)}</span>`} ${link(f.url)}</div>`).join("") : `<span class="empty">${esc(t("missing"))}</span>`}</div>
    <div>${esc(t("urlsInSitemap"))}</div><div class="val">${num(sm.total_urls)}</div>
    ${ai.length ? `<div>${esc(t("aiBots"))}</div><div class="chips" style="display:flex;flex-wrap:wrap;gap:4px">${ai.map(([b, ok]) => `<span class="chip ${ok ? "good" : "bad"}">${esc(b)}</span>`).join("")}</div>` : ""}
  </div>`;
}

function summary(){
  const s = state.meta.summary;
  const canon = s.canonical ? `${link(s.canonical)} <span class="chip ${s.canonical_self ? "good" : "warn"}">${esc(t(s.canonical_self ? "selfCanon" : "otherCanon"))}</span>` : `<span class="empty">${esc(t("missing"))}</span>`;
  const rows = [
    ["title", `${val(s.title)}${lenChip((s.title || "").length, 30, 65)} ${s.title ? `<button class="btn" type="button" data-copy="${esc(s.title)}">${esc(t("copy"))}</button>` : ""}`],
    ["description", `${val(s.description)}${lenChip((s.description || "").length, 70, 160)} ${s.description ? `<button class="btn" type="button" data-copy="${esc(s.description)}">${esc(t("copy"))}</button>` : ""}`],
    ["url", `${link(s.url)} ${lenChip(s.url.length, 1, 115)}`],
    ["canonical", canon],
    ["redirects", s.redirects.length ? s.redirects.map(r => `<div class="mono">${esc(r.status)} ${esc(r.url)}</div>`).join("") : `<span class="muted">${esc(t("none"))}</span>`],
    ["status", `<span class="chip ${s.status === 200 ? "good" : "bad"}">${esc(s.status)}</span>`],
    ["robots", val(s.robots || (lang === "vi" ? "index, follow (mặc định)" : "index, follow (default)"))],
    ["xrobots", s.x_robots_tag ? val(s.x_robots_tag, true) : `<span class="muted">${esc(t("none"))}</span>`],
    ["keywords", s.keywords ? val(s.keywords) : `<span class="muted">${esc(t("none"))}</span>`],
    ["lang", val(s.lang, true)], ["charset", val(s.charset, true)], ["viewport", val(s.viewport, true)],
    ["words", `<span class="val">${num(s.word_count)}</span>`],
    ["ttfb", `<span class="val">${s.ttfb_ms != null ? num(s.ttfb_ms) + " ms" : "–"}</span>`], ["size", `<span class="val">${num(Math.round(s.bytes / 1024))} KB</span>`],
    ["author", s.author ? val(s.author) : `<span class="muted">${esc(t("none"))}</span>`], ["publisher", s.publisher ? link(s.publisher) : `<span class="muted">${esc(t("none"))}</span>`],
    ["favicon", s.favicon ? `<img src="${safeHref(s.favicon)}" alt="" width="16" height="16" style="vertical-align:-3px"> ${link(s.favicon)}` : `<span class="empty">${esc(t("missing"))}</span>`],
    ["hreflang", s.hreflang.length ? s.hreflang.map(h => `<div><span class="chip">${esc(h.lang)}</span> ${link(h.href)}</div>`).join("") : `<span class="muted">${esc(t("none"))}</span>`],
    ["generator", s.generator ? val(s.generator) : `<span class="muted">${esc(t("none"))}</span>`], ["server", s.server ? val(s.server, true) : `<span class="muted">${esc(t("none"))}</span>`],
    ["themeColor", s.theme_color ? `<span class="val mono"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;background:${/^#[0-9a-f]{3,8}$/i.test(s.theme_color) ? s.theme_color : "transparent"}"></span> ${esc(s.theme_color)}</span>` : `<span class="muted">${esc(t("none"))}</span>`],
  ];
  return `<div class="grid2"><div class="box"><div class="kv">${rows.map(([k, v]) => `<div>${esc(t(k))}</div><div>${v}</div>`).join("")}</div></div>
    <div class="stack"><div class="box"><h2>${esc(t("serp"))}</h2>${serpPreview()}</div><div class="box"><h2>${esc(t("robotsTxt"))} · ${esc(t("sitemap"))}</h2>${robotsBlock()}</div></div></div>`;
}

function headings(){
  const h = state.meta.headings;
  const items = h.items.filter(x => !state.hLevel || x.level === state.hLevel);
  return `<div class="tiles">${[1, 2, 3, 4, 5, 6].map(i => `<div class="tile ${i === 1 && h.counts.h1 !== 1 ? (h.counts.h1 ? "warn" : "bad") : ""}"><b>${h.counts["h" + i]}</b><span>H${i}</span></div>`).join("")}</div>
    <div class="box"><h2>${esc(t("outline"))} ${h.skips ? `<span class="chip warn">${esc(lang === "vi" ? `bỏ qua cấp ${h.skips} lần` : `${h.skips} skipped levels`)}</span>` : ""}</h2>
    <div class="toolbar"><button class="btn" type="button" data-hl="0" aria-pressed="${!state.hLevel}">${esc(t("filterAll"))}</button>${[1, 2, 3, 4, 5, 6].map(i => `<button class="btn" type="button" data-hl="${i}" aria-pressed="${state.hLevel === i}">H${i}</button>`).join("")}
      <button class="btn" type="button" data-csv="headings">${esc(t("exportCsv"))}</button></div>
    <ul class="outline">${items.map(x => `<li style="padding-left:${state.hLevel ? 0 : (x.level - 1) * 18}px"><span class="lv h${x.level}">H${x.level}</span><span>${esc(x.text) || `<span class="empty">(${esc(lang === "vi" ? "rỗng" : "empty")})</span>`}</span></li>`).join("") || `<li class="muted">${esc(t("none"))}</li>`}</ul></div>`;
}

function images(){
  const im = state.meta.images;
  const items = im.items.filter(i => !state.imgMissing || i.alt == null);
  return `<div class="tiles">
    <div class="tile"><b>${num(im.total)}</b><span>${esc(t("imgTotal"))}</span></div>
    <div class="tile ${im.missing_alt ? "bad" : ""}"><b>${num(im.missing_alt)}</b><span>${esc(t("imgNoAlt"))}</span></div>
    <div class="tile"><b>${num(im.empty_alt)}</b><span>${esc(t("imgEmptyAlt"))}</span></div>
    <div class="tile"><b>${num(im.missing_title)}</b><span>${esc(t("imgNoTitle"))}</span></div>
    <div class="tile ${im.no_dimensions ? "warn" : ""}"><b>${num(im.no_dimensions)}</b><span>${esc(t("imgNoDim"))}</span></div></div>
    <div class="toolbar"><button class="btn" type="button" data-imgmissing aria-pressed="${state.imgMissing}">${esc(t("onlyMissingAlt"))}</button><button class="btn" type="button" data-csv="images">${esc(t("exportCsv"))}</button></div>
    <div class="tw"><table><thead><tr><th>${esc(t("image"))}</th><th>${esc(t("alt"))}</th><th>Title</th><th>${esc(t("size2"))}</th><th>URL</th></tr></thead><tbody>
    ${items.map(i => `<tr><td>${/^https?:/i.test(i.src) ? `<img class="thumb" src="${safeHref(i.src)}" alt="" loading="lazy">` : ""}</td>
      <td>${i.alt == null ? `<span class="chip bad">${esc(t("missing"))}</span>` : i.alt.trim() ? esc(i.alt) : `<span class="chip">${esc(t("imgEmptyAlt"))}</span>`}</td>
      <td>${i.title ? esc(i.title) : `<span class="muted">–</span>`}</td><td class="mono">${i.width && i.height ? esc(i.width + "×" + i.height) : `<span class="chip warn">?</span>`}</td><td>${link(i.src)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">${esc(t("none"))}</td></tr>`}
    </tbody></table></div>`;
}

function filteredLinks(){
  const q = state.linkQuery.toLowerCase();
  return state.meta.links.items.filter(l => (state.linkFilter === "all" || (state.linkFilter === "nofollow" ? l.rel.includes("nofollow") : l.kind === state.linkFilter)) && (!q || (l.href + " " + l.anchor).toLowerCase().includes(q)));
}

function links(){
  const L = state.meta.links, items = filteredLinks();
  const f = (id, k, n) => `<button class="btn" type="button" data-lf="${id}" aria-pressed="${state.linkFilter === id}">${esc(t(k))} <span class="muted">${num(n)}</span></button>`;
  return `<div class="tiles">
    <div class="tile"><b>${num(L.total)}</b><span>${esc(t("linkTotal"))}</span></div><div class="tile"><b>${num(L.unique)}</b><span>${esc(t("linkUnique"))}</span></div>
    <div class="tile"><b>${num(L.internal)}</b><span>${esc(t("internal"))}</span></div><div class="tile"><b>${num(L.external)}</b><span>${esc(t("external"))}</span></div>
    <div class="tile"><b>${num(L.nofollow)}</b><span>${esc(t("nofollow"))}</span></div><div class="tile"><b>${num(L.missing_title)}</b><span>${esc(t("noTitle"))}</span></div>
    <div class="tile ${L.empty_anchor ? "warn" : ""}"><b>${num(L.empty_anchor)}</b><span>${esc(t("emptyAnchor"))}</span></div></div>
    <div class="toolbar">${f("all", "filterAll", L.total)}${f("internal", "internal", L.internal)}${f("external", "external", L.external)}${f("nofollow", "nofollow", L.nofollow)}
      <input type="search" id="link-q" placeholder="${esc(t("search"))}" value="${esc(state.linkQuery)}"><button class="btn" type="button" data-csv="links">${esc(t("exportCsv"))}</button></div>
    <div class="tw"><table><thead><tr><th>#</th><th>${esc(t("anchor"))}</th><th>URL</th><th>${esc(t("type"))}</th><th>${esc(t("rel"))}</th><th>Title</th></tr></thead><tbody>
    ${items.map((l, i) => `<tr><td class="num">${i + 1}</td><td>${l.anchor ? esc(l.anchor) : `<span class="chip warn">${esc(t("emptyAnchor"))}</span>`}</td><td>${link(l.href)}</td>
      <td><span class="chip ${l.kind === "internal" ? "acc" : ""}">${esc(l.kind === "other" ? "other" : t(l.kind))}</span></td><td class="mono">${esc(l.rel) || "–"}</td><td>${l.title ? esc(l.title) : "–"}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">${esc(t("none"))}</td></tr>`}
    </tbody></table></div>`;
}

function social(){
  const {og, twitter} = state.meta.social, s = state.meta.summary;
  let host = ""; try { host = new URL(s.url).hostname; } catch (e) {}
  const img = og["og:image"] || twitter["twitter:image"] || twitter["twitter:image:src"];
  const card = (title, desc, im) => `<div class="card-prev"><div class="img" ${im && /^https?:/i.test(im) ? `style="background-image:url('${esc(im).replace(/'/g, "%27")}')"` : ""}>${im ? "" : esc(t("noImage"))}</div>
    <div class="body"><div class="dom">${esc(host)}</div><div class="ct">${esc(title || s.title || host)}</div><div class="cd">${esc(desc || s.description || "")}</div></div></div>`;
  const table = obj => { const e = Object.entries(obj); return e.length ? `<div class="kv">${e.map(([k, v]) => `<div class="mono">${esc(k)}</div><div class="val">${/^https?:/i.test(v) ? link(v) : esc(v) || `<span class="empty">${esc(t("missing"))}</span>`}</div>`).join("")}</div>` : `<div class="empty">${esc(t("missing"))}</div>`; };
  return `<div class="grid2"><div class="stack"><div class="box"><h2>${esc(t("ogTags"))}</h2>${table(og)}</div><div class="box"><h2>${esc(t("twTags"))}</h2>${table(twitter)}</div></div>
    <div class="stack"><div class="box"><h2>${esc(t("fbPreview"))}</h2>${card(og["og:title"], og["og:description"], og["og:image"])}</div>
    <div class="box"><h2>${esc(t("twPreview"))}</h2>${card(twitter["twitter:title"] || og["og:title"], twitter["twitter:description"] || og["og:description"], twitter["twitter:image"] || twitter["twitter:image:src"] || og["og:image"])}</div></div></div>`;
}

function schema(){
  const sc = state.meta.schema;
  if (!sc.jsonld.length && !sc.microdata.length && !sc.rdfa.length) return `<div class="box"><div class="empty">${esc(t("noSchema"))}</div><p class="muted" style="margin:.6em 0 0">${esc(lang === "vi" ? "Gợi ý: thêm JSON-LD Organization và WebSite cho trang chủ, Article cho bài viết, Product cho sản phẩm." : "Tip: add Organization and WebSite JSON-LD on the homepage, Article on posts, Product on product pages.")}</p></div>`;
  return `${sc.jsonld.map((b, i) => `<details class="sd" ${i === 0 ? "open" : ""}><summary><span class="chip ${b.valid ? "good" : "bad"}">${esc(t("jsonld"))} · ${esc(t(b.valid ? "valid" : "invalid"))}</span>${b.types.map(x => `<span class="chip acc">${esc(x)}</span>`).join("")}${b.error ? `<span class="muted mono">${esc(b.error)}</span>` : ""}</summary><pre class="mono">${esc(b.json)}</pre></details>`).join("")}
    ${sc.microdata.length ? `<div class="box" style="margin-top:10px"><h2>${esc(t("microdata"))}</h2>${sc.microdata.map(x => `<div class="mono">${esc(x)}</div>`).join("")}</div>` : ""}
    ${sc.rdfa.length ? `<div class="box" style="margin-top:10px"><h2>${esc(t("rdfa"))}</h2>${sc.rdfa.map(x => `<div class="mono">${esc(x)}</div>`).join("")}</div>` : ""}`;
}

function tools(){
  const groups = {};
  state.meta.tools.forEach(x => (groups[x.group] = groups[x.group] || []).push(x));
  return Object.entries(groups).map(([g, list]) => `<div class="box" style="margin-bottom:14px"><h2>${esc(t("groups")[g] || g)}</h2><div class="toolgrid">${list.map(x => `<a href="${safeHref(x.href)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}<span>↗</span></a>`).join("")}</div></div>`).join("");
}

function audit(){
  if (!state.auditOn) return `<div class="box">${esc(t("auditOff"))}</div>`;
  const a = state.audit;
  if (state.auditError || (a && a.status === "error")) return `<div class="box"><div class="note">${esc(t("auditError"))}: ${esc(state.auditError || (lang === "vi" ? a.error_vi || a.error : a.error))}</div>${a ? logBox(a) : ""}</div>`;
  if (!a || !a.result) return `<div class="box">${stagesBar(a)}</div>${a ? logBox(a) : ""}`;
  const r = a.result;
  const acts = r.actions;
  return `<div class="grid2">
    <div class="stack"><div class="box"><h2>${esc(t("areas"))} <span class="chip acc">${r.overall}% · ${esc(r.grade)}</span></h2>
      ${r.partial.length ? `<div class="note" style="margin-bottom:12px">${esc(t("partial"))}: ${(lang === "vi" ? r.partial_vi : r.partial).map(esc).join("; ")}</div>` : ""}
      ${catBars(r.categories)}
      <p class="muted" style="font-size:.82rem;margin:.9em 0 0">${esc(t("pagesCrawled")(r.pages_crawled))}${r.hit_page_cap ? " · " + esc(t("capHit")) : ""} · ${esc(t("passRules")(r.passed_rules))}</p></div>
      <div class="box"><h2>${esc(t("downloads"))}</h2><div class="dl">${(a.files || []).map(f => `<a class="btn primary" href="/api/audits/${encodeURIComponent(a.id)}/files/${encodeURIComponent(f)}">${esc(f.split(".").pop().toUpperCase())}</a>`).join("") || `<span class="muted">${esc(t("none"))}</span>`}</div></div>
      ${logBox(a)}</div>
    <div class="box"><h2>${esc(t("actions"))} <span style="display:flex;gap:4px"><span class="pri P1 chip">P1 ${r.counts.P1}</span><span class="pri P2 chip">P2 ${r.counts.P2}</span><span class="pri P3 chip">P3 ${r.counts.P3}</span></span></h2>
      ${acts.map(x => `<details class="act"><summary><span class="pri ${x.priority}">${esc(x.priority)}</span><span><b>${esc(lang === "vi" ? x.title_vi : x.title)}</b><div class="meta">
        <span class="chip">${esc(lang === "vi" ? x.category_vi : x.category)}</span><span class="chip">${esc(t("impact"))} ${x.impact}</span><span class="chip">${esc(t("effort"))} ${x.effort}/4</span>${x.quick_win ? `<span class="chip good">${esc(t("quickWin"))}</span>` : ""}${x.heuristic ? `<span class="chip">${esc(t("heuristic"))}</span>` : ""}${x.needs_review ? `<span class="chip warn">${esc(t("toVerify"))}</span>` : ""}</div></span><span class="muted mono">×${x.count}</span></summary>
        <div class="inner"><div><b>${esc(t("fix"))}:</b> ${esc(lang === "vi" ? x.fix_vi : x.fix)}</div><div><b>${esc(t("evidence"))}:</b> <span class="muted">${esc(x.evidence)}</span></div>
        ${x.urls.length ? `<div><b>${esc(t("pages"))}:</b><ul>${x.urls.map(u => `<li>${link(u)}</li>`).join("")}</ul></div>` : ""}
        ${x.source ? `<div><b>${esc(t("source"))}:</b> ${link(x.source)}</div>` : ""}<div class="muted mono">${esc(x.action_id)} · ${esc(x.id)}</div></div></details>`).join("") || `<p class="muted">${esc(t("noActions"))}</p>`}
    </div></div>`;
}

function logBox(a){ return `<div class="box"><h2>${esc(t("progressLog"))}</h2><pre class="log mono">${esc((a.log || []).join("\n"))}</pre></div>`; }

/* ---------- interactions ---------- */
function csv(rows){ return rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n"); }
function download(name, text){ const b = new Blob(["﻿" + text], {type: "text/csv;charset=utf-8"}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => {URL.revokeObjectURL(a.href); a.remove();}, 500); }
function exportCsv(kind){
  const m = state.meta, host = (() => {try {return new URL(m.summary.url).hostname} catch (e) {return "page"}})();
  if (kind === "links") download(`${host}-links.csv`, csv([["anchor", "url", "type", "rel", "title"], ...filteredLinks().map(l => [l.anchor, l.href, l.kind, l.rel, l.title])]));
  if (kind === "images") download(`${host}-images.csv`, csv([["src", "alt", "title", "width", "height"], ...m.images.items.map(i => [i.src, i.alt, i.title, i.width, i.height])]));
  if (kind === "headings") download(`${host}-headings.csv`, csv([["level", "text"], ...m.headings.items.map(h => ["H" + h.level, h.text])]));
}
function bind(){
  const p = $("#panel");
  p.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => {state.tab = b.dataset.goto; render(); window.scrollTo({top: $("#tabs").offsetTop - 10});});
  p.querySelectorAll("[data-lf]").forEach(b => b.onclick = () => {state.linkFilter = b.dataset.lf; render();});
  p.querySelectorAll("[data-hl]").forEach(b => b.onclick = () => {state.hLevel = +b.dataset.hl; render();});
  p.querySelectorAll("[data-imgmissing]").forEach(b => b.onclick = () => {state.imgMissing = !state.imgMissing; render();});
  p.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => exportCsv(b.dataset.csv));
  p.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = t("copied"); } catch (e) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling.previousElementSibling || b); getSelection().removeAllRanges(); getSelection().addRange(r); }
  });
  const q = $("#link-q"); if (q) q.oninput = () => {state.linkQuery = q.value; render();};
}

applyLang();
recent();
fetch("/healthz").then(r => r.json()).then(d => $("#ver").textContent = d.version).catch(() => {});
const initial = new URLSearchParams(location.search).get("url");
if (initial) { $("#url").value = initial; run(); }
</script>
</body>
</html>
